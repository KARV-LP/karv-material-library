name: Materialize F4 PBR assets

on:
  push:
    branches:
      - agent/f4-pbr-publication

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/f4-pbr-publication

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Download verified Drive masters
        run: |
          set -euo pipefail
          mkdir -p /tmp/karv-pbr
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1tY7PkcpPa7Fkguqp0iwvBznV_dIACbl4&export=download&confirm=t' \
            -o /tmp/karv-pbr/base-color-source.webp
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1i6-oP_XVh0aPyyhq4co3bV8vnVdgveZc&export=download&confirm=t' \
            -o /tmp/karv-pbr/normal-source.webp
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1eKKGS0yL8oMJJ9sSTpTnCkJ0n7ZK_akV&export=download&confirm=t' \
            -o /tmp/karv-pbr/ao-source.webp

          echo 'd93454ccd522d5595079f7584deae4b7ca519218d999c3fa6e42039f614135a2  /tmp/karv-pbr/base-color-source.webp' | sha256sum -c -
          echo '56bb75d1a95c6407e7aa61b04ba25846c30d43d8815e5e12dc559417731d3218  /tmp/karv-pbr/normal-source.webp' | sha256sum -c -
          echo '9e83bc7ed0201c8af092524ea02dd536161e46f2528977c6ae9658aba3b28bdd  /tmp/karv-pbr/ao-source.webp' | sha256sum -c -

      - name: Build 2K web PBR set
        run: |
          set -euo pipefail
          target='public/v1/assets/fabric-kv-002'
          mkdir -p "$target" /tmp/karv-pbr/png

          dwebp /tmp/karv-pbr/base-color-source.webp -o /tmp/karv-pbr/png/base-color.png
          dwebp /tmp/karv-pbr/normal-source.webp -o /tmp/karv-pbr/png/normal.png
          dwebp /tmp/karv-pbr/ao-source.webp -o /tmp/karv-pbr/png/ao.png

          cwebp -quiet -q 88 -m 6 -resize 2048 1024 /tmp/karv-pbr/png/base-color.png -o "$target/base-color.webp"
          cwebp -quiet -q 94 -m 6 -resize 2048 1024 /tmp/karv-pbr/png/normal.png -o "$target/normal.webp"
          cwebp -quiet -q 90 -m 6 -resize 2048 1024 /tmp/karv-pbr/png/ao.png -o "$target/ao.webp"

          BASE_SHA=$(sha256sum "$target/base-color.webp" | cut -d' ' -f1)
          NORMAL_SHA=$(sha256sum "$target/normal.webp" | cut -d' ' -f1)
          AO_SHA=$(sha256sum "$target/ao.webp" | cut -d' ' -f1)
          BASE_SIZE=$(stat -c%s "$target/base-color.webp")
          NORMAL_SIZE=$(stat -c%s "$target/normal.webp")
          AO_SIZE=$(stat -c%s "$target/ao.webp")

          cat > "$target/pbr-manifest.json" <<EOF
          {
            "schema": "karv.web-pbr-asset-set/1",
            "material_id": "fabric-kv-002",
            "source": {
              "base_color_sha256": "d93454ccd522d5595079f7584deae4b7ca519218d999c3fa6e42039f614135a2",
              "normal_sha256": "56bb75d1a95c6407e7aa61b04ba25846c30d43d8815e5e12dc559417731d3218",
              "ao_sha256": "9e83bc7ed0201c8af092524ea02dd536161e46f2528977c6ae9658aba3b28bdd"
            },
            "web": {
              "width_px": 2048,
              "height_px": 1024,
              "base_color": { "sha256": "$BASE_SHA", "bytes": $BASE_SIZE },
              "normal": { "sha256": "$NORMAL_SHA", "bytes": $NORMAL_SIZE },
              "ao": { "sha256": "$AO_SHA", "bytes": $AO_SIZE }
            }
          }
          EOF

      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v1/assets/fabric-kv-002/base-color.webp \
                  public/v1/assets/fabric-kv-002/normal.webp \
                  public/v1/assets/fabric-kv-002/ao.webp \
                  public/v1/assets/fabric-kv-002/pbr-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat(f4): materialize Croma production PBR assets'
          git push origin HEAD:agent/f4-pbr-publication
