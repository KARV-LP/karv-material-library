name: Build fabric-kv-009

on:
  push:
    branches:
      - feat/add-fabric-kv-009
    paths:
      - .github/workflows/build-fabric-kv-009.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-fabric-kv-009
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false sharp
      - run: node scripts/add-fabric-kv-009.mjs
      - run: node scripts/validate-public-catalog.mjs
      - name: Remove one-time build files
        run: |
          rm -f scripts/add-fabric-kv-009.mjs
          rm -f .github/workflows/build-fabric-kv-009.yml
      - name: Commit generated fabric
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: adicionar fabric-kv-009 Malaga 03"
          git push origin HEAD:feat/add-fabric-kv-009
